<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, "微软雅黑", "Segoe UI", sans-serif}
body{background:#f0f2f5;padding:12px}
.container{max-width:1400px;margin:0 auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,0.05)}
h2{text-align:center;color:#1e466e;margin-bottom:16px;font-weight:600;font-size:1.3rem}
.sync-status{text-align:center;font-size:12px;margin-bottom:12px;padding:6px;border-radius:20px}
.sync-status.online{background:#d5f5e3;color:#27ae60}
.sync-status.offline{background:#fadbd8;color:#e74c3c}
.sync-status.loading{background:#fef9e7;color:#f39c12}
.box{margin-bottom:16px;padding:12px;border:1px solid #e9ecef;border-radius:12px;background:#fefefe}
.title{font-size:14px;font-weight:bold;margin-bottom:10px;color:#2c7da0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.fold-btn{cursor:pointer;color:#2c7da0;font-size:11px;background:#eef2f6;padding:3px 8px;border-radius:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
input,select,textarea{flex:1;min-width:120px;padding:8px 10px;border:1px solid #cfdee9;border-radius:8px;outline:none;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:#3498db;box-shadow:0 0 0 2px rgba(52,152,219,0.2)}
.ro-field{background:#f7f9fb;color:#2c3e50;cursor:default}
.ro-field:focus{border-color:#cfdee9;box-shadow:none}
textarea{resize:none;height:55px}
button{padding:6px 12px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-size:12px;font-weight:500;transition:all 0.2s}
button:active{transform:scale(0.96)}
.btn-add{background:#2c6e2f}
.btn-add:hover{background:#1e5621}
.btn-out{background:#c44536}
.btn-out:hover{background:#a33426}
.btn-search{background:#2c7da0}
.btn-export{background:#6f42c1}
.btn-del{background:#c0392b}
.btn-reset{background:#e67e22}
.btn-his{background:#8e44ad}
.btn-edit-text{background:#5d6d7e}
.btn-sm{padding:3px 8px;font-size:11px;border-radius:16px}
.tag-item{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;padding:3px 8px;border-radius:20px;margin:3px 5px 3px 0;font-size:11px}
.tag-item button{margin-left:3px;padding:1px 5px;font-size:10px}
.table-wrapper{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #e9edf2;padding:6px 4px;text-align:center}
th{background:#f8fafc;font-weight:600;color:#1e466e}
tr{cursor:pointer}
tr:hover{background:#fef9e6}
.warn-red{color:#e74c3c !important;font-weight:600}
.tab{display:none}
.tab.active{display:block}
.tab-btn{margin:0 3px;padding:5px 14px;background:#e9ecef;border:none;border-radius:25px;font-weight:500;cursor:pointer;font-size:12px}
.tab-btn.active{background:#2c7da0;color:#fff}
.fold-content{overflow:hidden;transition:all 0.2s}
.fold-close{max-height:0;padding:0;margin:0}
.fold-open{max-height:500px;padding-top:5px}
.check-item{width:14px;height:14px;cursor:pointer;accent-color:#2c7da0}
#allStockTable .selCol{display:none}
#allStockTable.selecting .selCol{display:table-cell}
#allStockTable th.sortable{cursor:pointer;user-select:none}
#allStockTable th.sortable:hover{background:#eef4fa}
#allStockTable th.sortable .arrow{font-size:10px;color:#a8bccd;margin-left:3px}
#allStockTable th.sortable.active{color:#185c7d}
#allStockTable th.sortable.active .arrow{color:#2c7da0}
.loading-text{text-align:center;padding:15px;color:#666;font-size:12px}
.modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:18px;border-radius:16px;box-shadow:0 20px 35px rgba(0,0,0,0.2);z-index:1000;width:90%;max-width:400px}
.modal h3{margin-bottom:12px;font-size:16px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999}
@media (max-width:640px){
    .container{padding:10px}
    input,select,textarea{padding:6px 8px;font-size:12px}
    button{padding:5px 10px;font-size:11px}

// 云端状态提示：把真实原因显示出来，不再统一提示"请检查网络"
function setSyncStatus(state, text) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.className = 'sync-status ' + (state === 'online' ? 'online' : state === 'loading' ? 'loading' : 'offline');
    el.textContent = text;
}

// 初始化
async function init() {
    bindEvents();
    if (!window.supabase || !window.supabase.createClient) {
        setSyncStatus('offline', '⚠️ 云端客户端未加载，当前为本地模式（改动不会保存到云端）');
        loadLocalDemoData();
        restoreLastView();
        return;
    }
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            realtime: { params: { eventsPerSecond: 5 } }
        });
        const { error } = await supabase.from('spare_stock').select('id', { count: 'exact', head: true });
        if (error) throw error;
        setSyncStatus('loading', '🔄 云端已连接，正在加载数据并建立实时通道…');
        await loadAllData();
        await loadHistoryData();
        restoreLastView();
        setupRealtime();
    } catch (err) {
        console.error('Supabase连接失败:', err);
        const msg = (err && (err.message || err.error_description || err.details)) || String(err);
        setSyncStatus('offline', '⚠️ 云端连接失败：' + msg + '（当前为本地模式，改动不会同步）');
        supabase = null;
        loadLocalDemoData();
        restoreLastView();
    }
}

// ===== 多端实时同步 =====
let realtimeChannel = null;
let syncTimer = null;
let realtimeRetry = null;

// 通过 HTTP 中转访问时 WebSocket 实时通道不可用，改用「定时轮询 + 回到前台立即刷新」
let pollTimer = null;

function setupRealtime() {
    if (!supabase) return;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    pollTimer = setInterval(() => {
        if (document.visibilityState === 'visible') cloudRefresh();
    }, 5000);
    setSyncStatus('online', '✅ 云端已连接 · 多端自动同步中（每 5 秒刷新）');
}

function scheduleCloudRefresh() {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { syncTimer = null; cloudRefresh(); }, 250);
}

async function cloudRefresh() {
    if (!supabase) return;
    try {
        const beforeSig = JSON.stringify(allStockData) + '|' + JSON.stringify(currentHistoryData);
        await loadStockData();
        await loadHistoryData();
        await loadAreas();
        if (JSON.stringify(allStockData) + '|' + JSON.stringify(currentHistoryData) !== beforeSig) rerenderAll();
        if (document.getElementById('syncStatus').className.indexOf('online') === -1) {
            setSyncStatus('online', '✅ 云端已连接 · 多端自动同步中（每 5 秒刷新）');
        }
    } catch (err) {
        console.error('云端刷新失败:', err);
    }
}

// 保留用户当前的查询条件与表格展开状态，只替换数据
function rerenderAll() {
    refreshCurrentView();
    if (document.getElementById('allStockBox').style.display === 'block') renderAllStockTable();
    if (document.getElementById('tab1').classList.contains('active')) renderHistoryTable(currentHistoryData);
}

// ===== 查询视图记忆（防止 5 秒轮询把查询结果清掉） =====
let lastView = null;
function saveLastView(v) {
    lastView = v;
    try { sessionStorage.setItem('stock_view', JSON.stringify(v)); } catch (e) { }
}
function loadLastView() {
    if (lastView) return lastView;
    try { lastView = JSON.parse(sessionStorage.getItem('stock_view') || 'null'); } catch (e) { lastView = null; }
    return lastView;
}

// 清空查询结果表格（显示提示文字）
function clearStockTable() {
    const tbody = document.getElementById('stockTable');
    if (tbody) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#aaa;">🔍 点击"查询"按钮加载数据</td></tr>';
    }
}

function bindEvents() {
    document.getElementById('searchBtn').onclick = () => searchStock();
    document.getElementById('resetSearchBtn').onclick = () => resetSearch();
    document.getElementById('batchDeleteBtn').onclick = () => batchDelete();
    document.getElementById('stockInBtn').onclick = () => stockIn();
    document.getElementById('stockOutBtn').onclick = () => stockOut();
    document.getElementById('toggleAllStockBtn').onclick = () => toggleAllStockTable();
    document.getElementById('exportStockBtn').onclick = () => exportStockExcel();
    document.getElementById('batchDeleteAllBtn').onclick = () => toggleSelectionMode();
    document.getElementById('confirmDeleteAllBtn').onclick = () => batchDeleteAllStock();
    document.getElementById('checkAllAll').onclick = () => checkAllAllItems();
    document.querySelectorAll('#allStockTable th.sortable').forEach(th => {
        th.onclick = () => toggleStockSort(th.getAttribute('data-key'));
    });
    document.getElementById('addStockBtn').onclick = () => addStock();

    document.getElementById('importFile').onchange = (e) => importExcelData(e);
    
    const exportHistory = document.getElementById('exportHistoryBtn');
    if(exportHistory) exportHistory.onclick = () => exportHistoryExcel();
    const batchDelHistory = document.getElementById('batchDelHistoryBtn');
    if(batchDelHistory) batchDelHistory.onclick = () => batchDeleteHistory();
    
    document.getElementById('checkAll').onclick = () => checkAllItem();
    document.getElementById('checkAllHistory').onclick = () => toggleCheckAllHistory();
    
    document.getElementById('saveEditBtn').onclick = () => saveEditInfo();
    document.getElementById('cancelEditBtn').onclick = () => closeEditModal();
    document.getElementById('modalOverlay').onclick = () => closeEditModal();
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = (e) => {
            const idx = parseInt(btn.getAttribute('data-tab'));

// 本地演示数据 - 仅加载到内存，不显示到查询结果表

async function loadAllData() {
    await loadStockData();
    await loadAreas();
}

async function loadStockData() {
    try {
        const { data, error } = await supabase.from('spare_stock').select('*').order('sp_name');
        if (error) throw error;
        allStockData = data || [];
        localStorage.setItem('stock_backup', JSON.stringify(allStockData));
    } catch (err) {
        console.error('加载库存失败:', err);
        const backup = localStorage.getItem('stock_backup');
        if (backup) {
            allStockData = JSON.parse(backup);
        }
    }
}

async function loadAreas() {
    try {
        const { data, error } = await supabase.from('ware_areas').select('*').order('sort_order');
        if (error) throw error;
        const areas = data.map(a => a.name);
        renderAreaSelect(areas);
        renderAreaTags(areas);
    } catch (err) {
        console.error('加载分区失败:', err);
        const defaultAreas = ["A区货架", "B区货架", "C区耗材区", "备品专库区", "室外堆放区"];
        renderAreaSelect(defaultAreas);
        renderAreaTags(defaultAreas);
    }
}

async function loadHistoryData() {
    if (!supabase) {
        renderHistoryTable([]);
        return;
    }
    try {
        const { data, error } = await supabase.from('spare_history').select('*').order('hid', { ascending: false }).limit(200);
        if (error) throw error;
        currentHistoryData = data || [];
        renderHistoryTable(currentHistoryData);
    } catch (err) {
        console.error('加载历史失败:', err);
        renderHistoryTable([]);
    }
}

// 点击表格行后，把该备件的料码/备件名/型号/位置填入入库出库区
function fillOperInfo(item) {
    if (!item) return;
    document.getElementById('editId').value = item.id || '';
    document.getElementById('editSpName').value = item.sp_name || '';
    document.getElementById('editModel').value = item.model || '';
    document.getElementById('editPosition').value = item.position || '';
}

// 渲染查询结果表格
function renderStockTable(list) {
    const tbody = document.getElementById('stockTable');
    if (!tbody) return;
    if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">📭 没有找到匹配的备件</td></tr>';
        return;
    }
    tbody.innerHTML = '';
    list.forEach(item => {
        const isWarn = item.num <= item.low_warn;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="rowCheck" value="${escapeHtml(item.id)}"></td>
            <td>${escapeHtml(item.id)}</td>
            <td>${escapeHtml(item.ware_area || '')}</td>
            <td>${escapeHtml(item.device)}</td>
            <td>${escapeHtml(item.sp_name)}</td>
            <td>${escapeHtml(item.model || '')}</td>
            <td class="${isWarn ? 'warn-red' : ''}">${item.num}</td>
            <td>${item.low_warn}</td>
            <td>${escapeHtml(item.position || '')}</td>
        `;
        tr.onclick = (e) => {
            if (e.target.type !== 'checkbox') {
                fillOperInfo(item);
                showToast(`已选中: ${item.sp_name}`);
            }
        };
        tbody.appendChild(tr);
    });
    document.getElementById('checkAll').checked = false;
}

function renderHistoryTable(historyData) {
    const tbody = document.getElementById('historyTable');
    if (!tbody) return;
    if (!historyData || historyData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#aaa;">暂无记录</td></tr>';
        return;
    }
    tbody.innerHTML = '';
    historyData.forEach(rec => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="checkbox" class="historyCheck" value="${rec.hid}"></td>
            <td>${rec.hid}</td>
            <td>${escapeHtml(rec.time)}</td>
            <td>${escapeHtml(rec.type)}</td>
            <td>${escapeHtml(rec.sp_name)}</td>
            <td>${escapeHtml(rec.model || '-')}</td>
            <td>${escapeHtml(rec.device)}</td>
            <td>${rec.change_num}</td>
            <td>${escapeHtml(rec.note || '')}</td>
            <td><button class="btn-del btn-sm" data-hid="${rec.hid}">删除</button></td>
        `;
        const delBtn = tr.querySelector('button');
        delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteSingleHistory(rec.hid);
        };
        tbody.appendChild(tr);
    });
}

// 查询功能：空条件时显示低于预警物料，否则按条件筛选
function filterStockList(deviceKw, spKw) {
    const dev = deviceKw.toLowerCase();
    const sp = spKw.toLowerCase();
    return allStockData.filter(item => {
        const matchDev = dev === '' || String(item.device || '').toLowerCase().includes(dev);
        const matchSp = sp === '' ||
            String(item.sp_name || '').toLowerCase().includes(sp) ||
            String(item.model || '').toLowerCase().includes(sp) ||
            String(item.id || '').toLowerCase().includes(sp);
        return matchDev && matchSp;
    });
}

    if (v.mode === 'warn') {
        document.getElementById('searchDevice').value = '';
        document.getElementById('searchSp').value = '';

        });

}

// 总表排序：同一表头第一次点击升序，再次点击降序
function toggleStockSort(key) {
    if (!key) return;
    if (stockSortKey === key) {
        stockSortDir = stockSortDir === 'asc' ? 'desc' : 'asc';
    } else {
        stockSortKey = key;
        stockSortDir = 'asc';
    }
    renderAllStockTable();
}

function updateSortIndicators() {
    document.querySelectorAll('#allStockTable th.sortable').forEach(th => {
        const key = th.getAttribute('data-key');
        const arrow = th.querySelector('.arrow');
        const isActive = key === stockSortKey;
        th.classList.toggle('active', isActive);
        if (arrow) arrow.textContent = isActive ? (stockSortDir === 'asc' ? '↑' : '↓') : '⇅';
    });
}

function sortStockList(list) {
    if (!stockSortKey) return list;
    const numeric = stockSortKey === 'num' || stockSortKey === 'low_warn';
    const dir = stockSortDir === 'asc' ? 1 : -1;
    const copy = list.slice();
    copy.sort((a, b) => {
        let cmp;
        if (numeric) {
            cmp = (Number(a[stockSortKey]) || 0) - (Number(b[stockSortKey]) || 0);
        } else {
            cmp = String(a[stockSortKey] || '').localeCompare(String(b[stockSortKey] || ''), 'zh-CN', { numeric: true, sensitivity: 'base' });
        }
        if (cmp === 0) cmp = String(a.id || '').localeCompare(String(b.id || ''), 'zh-CN', { numeric: true });
        return cmp * dir;
    });
    return copy;
}

function renderAllStockTable() {
    const tb = document.getElementById('allStockTableBody');
    if (!tb) return;
    const checkAllBox = document.getElementById('checkAllAll');
    const table = document.getElementById('allStockTable');
    if (table) table.classList.toggle('selecting', selectionMode);
    updateSortIndicators();
    const sorted = sortStockList(allStockData);
    if (!sorted.length) {
        tb.innerHTML = `<tr><td colspan="${selectionMode ? 10 : 9}" style="text-align:center;color:#999;">📭 暂无库存数据</td></tr>`;
        if (checkAllBox) checkAllBox.checked = false;
        return;
    }
    tb.innerHTML = sorted.map(item => {
        const warnFlag = item.num <= item.low_warn;
        const isChecked = selectedStockIds.has(String(item.id));
        const checkCell = selectionMode
            ? `<td class="selCol"><input type="checkbox" class="allCheck" value="${escapeHtml(item.id)}" ${isChecked ? 'checked' : ''}></td>`
            : '';
        return `<tr>
            ${checkCell}
            <td>${escapeHtml(item.id)}</td><td>${escapeHtml(item.ware_area || '')}</td><td>${escapeHtml(item.device)}</td>
            <td>${escapeHtml(item.sp_name)}</td><td>${escapeHtml(item.model || '')}</td>
            <td class="${warnFlag ? 'warn-red' : ''}">${item.num}</td><td>${item.low_warn}</td>
            <td>${escapeHtml(item.position || '')}</td>
            <td><button class="btn-edit-text btn-sm" data-id="${escapeHtml(item.id)}">修改</button></td>
        `;
    }).join('');
    tb.querySelectorAll('button').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); openEditModal(btn.getAttribute('data-id')); };
    });
    tb.querySelectorAll('.allCheck').forEach(cb => {
        cb.onclick = (e) => {
            e.stopPropagation();
            if (cb.checked) selectedStockIds.add(cb.value);
            else selectedStockIds.delete(cb.value);
            const all = Array.from(document.querySelectorAll('.allCheck'));
            if (checkAllBox) checkAllBox.checked = all.length > 0 && all.every(x => x.checked);
        };
    });
    if (checkAllBox) checkAllBox.checked = sorted.length > 0 && selectedStockIds.size === sorted.length;
    tb.querySelectorAll('tr').forEach((tr, idx) => {
        tr.onclick = (e) => {
            if (e.target.type === 'checkbox' || e.target.tagName === 'BUTTON') return;
            fillOperInfo(sorted[idx]);
        };
    });
}

async function saveEditInfo() {
    const oldId = document.getElementById('modalEditId').value;
    const code = document.getElementById('modalCode').value.trim();
    const wareArea = document.getElementById('modalWareArea').value.trim();
    const device = document.getElementById('modalDevice').value.trim();
    const spName = document.getElementById('modalSpName').value.trim();
    const model = document.getElementById('modalModel').value.trim();
    const num = parseInt(document.getElementById('modalNum').value) || 0;
    const lowWarn = parseInt(document.getElementById('modalWarn').value) || 0;
    const position = document.getElementById('modalPos').value.trim();
    if (!code) { alert('料码不能为空'); return; }
    if (!spName || !device) { alert('备件名称与所属设备必填'); return; }
    if (!supabase) { alert('云端未连接'); return; }
    const payload = { ware_area: wareArea, device, sp_name: spName, model, num, low_warn: lowWarn, position };
    try {
        if (code === oldId) {
            const { error } = await supabase.from('spare_stock').update(payload).eq('id', oldId);
            if (error) throw error;
        } else {
            const dup = allStockData.find(i => String(i.id) === code);
            if (dup) { alert(`料码「${code}」已被占用：${dup.sp_name} ${dup.model || ''}`); return; }
            // 料码变更：先按新料码写入，再删除旧记录
            const { error: insErr } = await supabase.from('spare_stock').insert({ id: code, ...payload });
            if (insErr) throw insErr;
            const { error: delErr } = await supabase.from('spare_stock').delete().eq('id', oldId);
            if (delErr) throw new Error('新料码已写入，但旧料码删除失败：' + delErr.message);
        }
        closeEditModal();
        showToast('修改成功');
        await loadStockData();
        refreshCurrentView();
        if (document.getElementById('allStockBox').style.display === 'block') renderAllStockTable();
    } catch (err) { alert('修改失败: ' + err.message); }
}

async function importExcelData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);
        if (!supabase) { alert('云端未连接'); return; }
        let importedCount = 0;
        let skippedCount = 0;
        for (const row of rows) {
            const code = String(row.料码 || row['料码'] || row.ID || row.id || '').trim();
            const name = String(row.备件名称 || '').trim();
            const model = String(row.型号 || '').trim();
            const device = String(row.所属设备 || '').trim();
            if (!code || !name || !device) { skippedCount++; continue; }
            const newItem = { id: code, ware_area: row.仓库分区 || '', device, sp_name: name, model, num: parseInt(row.数量) || 0, low_warn: parseInt(row.预警数) || 5, position: row.存放位置 || '' };
            try {
                const { data: existing } = await supabase.from('spare_stock').select('id').eq('id', code);
                if (existing && existing.length > 0) {
                    const { data: current } = await supabase.from('spare_stock').select('num').eq('id', code).single();
                    if (current) await supabase.from('spare_stock').update({ num: current.num + newItem.num }).eq('id', code);
                } else { await supabase.from('spare_stock').insert(newItem); }
                await addHistoryRecord(name, model, device, '批量导入', `+${newItem.num}`, 'Excel导入');
                importedCount++;
            } catch (err) { console.error(err); skippedCount++; }
        }
        alert(`导入完成！成功 ${importedCount} 条${skippedCount ? `，跳过 ${skippedCount} 条（料码/名称/设备缺失或写入失败）` : ''}`);
        document.getElementById('importFile').value = '';
        await loadStockData();
        refreshCurrentView();
        if (document.getElementById('allStockBox').style.display === 'block') renderAllStockTable();
    };
    reader.readAsArrayBuffer(file);
}

function toggleFold() { const el = document.getElementById('inputFold'); el.classList.toggle('fold-close'); el.classList.toggle('fold-open'); }
function toggleBaseFold() { const el = document.getElementById('baseFold'); el.classList.toggle('fold-close'); el.classList.toggle('fold-open'); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
function showToast(msg) { const t = document.createElement('div'); t.innerText = msg; t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:white;padding:6px 16px;border-radius:30px;z-index:9999;font-size:12px'; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }

// 手机切回前台、网络恢复时，立刻补一次全量同步
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && supabase) {
        if (!pollTimer) setupRealtime();
        scheduleCloudRefresh();
    }
});
window.addEventListener('online', () => {
    if (supabase) { setupRealtime(); scheduleCloudRefresh(); }
});

// 启动
init();
</script>
</body>
